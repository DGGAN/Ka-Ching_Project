<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ka-Ching! — Smart Personal Finance Manager</title>
    <style>
      body {
        font-family: monospace;
        background: #faf6f0;
        color: #121212;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .card {
        max-width: 460px;
        background: #ffffff;
        border: 2px solid #121212;
        border-radius: 12px;
        padding: 28px;
        box-shadow: 4px 4px 0 #121212;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #4a4a4a;
      }
      .badge {
        display: inline-block;
        background: #dcfce7;
        color: #15803d;
        border: 1.5px solid #15803d;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: bold;
        margin-top: 8px;
      }
      .links {
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1.5px dashed #d6cfc2;
        display: flex;
        gap: 16px;
        font-size: 12px;
      }
      .links a {
        color: #121212;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ka-Ching!</h1>
      <p>
        Smart Personal Finance &amp; Expense Tracking Application featuring AI Receipt OCR Scanning, 50/30/20 Budget Planning, Predictive Spending
        Insights, and Opt-In eWallet Notification Auto-Capture.
      </p>
      <div class="badge">● SERVICE STATUS: ONLINE</div>
      <div class="links">
        <a href="/privacy">Privacy Policy (PDPA 2010)</a>
        <a href="/terms">Terms of Service</a>
      </div>

  </body>
</html>
